const RN=[['You','#e3a72f'],['Rani','#c1392b'],['Billu','#23395b'],['Bunty','#6b7a3a']];
function rStart(L){Rc={L,id:Date.now(),v:500/(62-2.5*L),d:[0,0,0,0],sp:[0,1,.92,.84],fin:[],boost:0,stun:0,go:0,pb:.46-L*.011,end:0,q:eq(L)};rScr()}
function rScr(){scr(`<div class="hud"><button class="btn" style="padding:4px 10px" onclick="Rc.id=0;gl('race')">✕</button><b>SKY RACE · LEVEL ${Rc.L}</b>${coin()}</div><div class="lanes">${RN.map((n,i)=>`<div class="lane ${i?'':'me'}"><b class="ln">${n[0]}<br><span id="m${i}">0</span>/500m</b><div class="trk"><div class="pl" id="p${i}">${plane(n[1])}</div></div></div>`).join('')}</div><div class="bar" title="Boost"><i id="bb" style="width:0;background:var(--gold)"></i></div><div class="ms" id="ms">${chibi('rani',44)}<span>Your plane crawls on its own. Answer equations to BOOST past the others!</span></div><div class="qp"><div class="qh">BOOST QUESTION</div><div class="qe" id="rq">Ready?</div></div><div class="io" id="rio"><button class="btn" onclick="rGo()">Start engines ✈️</button></div>`)}
function rGo(){Rc.go=1;rShow();rLoop(Rc.id,performance.now())}
function rShow(){$('#rq').textContent=Rc.q.e+' = ?';$('#rio').innerHTML=`<div class="paths">${opts(Rc.q.a).map((o,i)=>`<button class="btn" style="--c:${['#c1392b','#23395b','#6b7a3a'][i]}" onclick="rAns(${o},this)">${o}</button>`).join('')}</div>`}
function rAns(v,el){if(Rc.end)return;if(v==Rc.q.a){Rc.boost=Math.min(6,Rc.boost+3.5);Rc.stun=0;beep(700,.1);mm('billu','Boost! Keep answering!');Rc.q=eq(Rc.L);rShow()}else{beep(150,.25);Rc.stun=2;Rc.boost=0;el.disabled=true;mm('gajju','Rethink! Your engine stalled 🤔')}}
function rLoop(id,t){if(!Rc||Rc.id!==id||!$('#p0'))return;const n=performance.now(),dt=Math.min(.05,(n-t)/1000);
if(!Rc.end){Rc.boost=Math.max(0,Rc.boost-dt);Rc.stun=Math.max(0,Rc.stun-dt);Rc.d[0]+=Rc.v*(Rc.stun>0?.08:Rc.pb+(Rc.boost>0?1.25:0))*dt;
 for(let i=1;i<4;i++)Rc.d[i]+=Rc.v*Rc.sp[i]*(1+.1*Math.sin(n/600+i*2))*dt;
 for(let i=0;i<4;i++)if(Rc.d[i]>=500&&!Rc.fin.includes(i))Rc.fin.push(i);
 if(Rc.fin.includes(0)||Rc.fin.length>=3){Rc.end=1;setTimeout(rEnd,500)}}
for(let i=0;i<4;i++){const d=Math.min(500,Rc.d[i]);$('#p'+i).style.left=d/5+'%';$('#m'+i).textContent=Math.floor(d)}
$('#p0').classList.toggle('boost',Rc.boost>0&&Rc.stun<=0);$('#bb').style.width=Rc.boost/6*100+'%';requestAnimationFrame(()=>rLoop(id,n))}
function rEnd(){if(!Rc||!Rc.id)return;const p=Rc.fin.indexOf(0)+1;p?gwin('race',Rc.L,4-p,`You finished ${['1st','2nd','3rd'][p-1]}!`):glose('race',Rc.L,`${RN[Rc.fin[0]][0]} won the race. Answer faster to boost your plane!`)}
/* ---- 3. BATTLE BAY ---- */
let B;
function sStart(L){const n=Math.min(12,5+L),cnt=Math.min(5,2+Math.ceil(L/3)),sh=[],u=new Set(['0,0']);let g=0;
while(sh.length<cnt&&g++<500){const len=R(2,3),x=R(0,n-len),y=R(0,n-1),cs=Array.from({length:len},(_,i)=>(x+i)+','+y);if(cs.some(c=>u.has(c)))continue;cs.forEach(c=>u.add(c));sh.push({x,y,len,d:0})}
B={L,n,sh,lives:3,x:0,y:0,m:[],msg:'Count the squares from your base 🏠: X across, Y up, to the front of each 🚢. Then FIRE!'};sScr()}
function sx(k,d){B[k]=Math.max(0,Math.min(B.n-1,B[k]+d));sScr()}
function sScr(){const n=B.n;let cells='';
for(let r=n-1;r>=0;r--)for(let c=0;c<n;c++){const s=B.sh.find(s=>s.y==r&&c>=s.x&&c<s.x+s.len);let cl='gc2',tx='';
 if(!c&&!r){cl+=' base';tx='🏠'}else if(s){cl+=s.d?' sunk':' ship';if(c==s.x){tx=s.d?'💥':'🚢';if(!s.d)cl+=' bow'}}else if(B.m.includes(c+','+r))tx='💦';
 if((!r&&c>0&&c<=B.x)||(c==B.x&&r>0&&r<=B.y))cl+=' px';cells+=`<div class="${cl}">${tx}</div>`}
const left=B.sh.filter(s=>!s.d).length;
scr(`<div class="hud"><button class="btn" style="padding:4px 10px" onclick="B=0;gl('ship')">✕</button><b>BATTLE BAY · LEVEL ${B.L}</b><span class="pill" title="Your fleet">${'⚓'.repeat(B.lives)}${'💥'.repeat(3-B.lives)}</span>${coin()}</div><div class="ms" id="ms">${chibi('chintu',44)}<span>${B.msg}</span></div><div class="bay"><div class="sea" style="--n:${n};--cs:calc(min(50vh,90vw,520px)/${n})">${cells}</div><div class="ctl"><p class="sm">Enemy ships left: ${left}</p>${['x','y'].map(k=>`<div class="stp"><span>${k=='x'?'X → squares across':'Y ↑ squares up'}</span><div><button class="btn" onclick="sx('${k}',-1)">−</button><b class="disp" style="min-width:70px;display:inline-block">${B[k]}</b><button class="btn" onclick="sx('${k}',1)">+</button></div></div>`).join('')}<button class="btn" style="--c:#c1392b" onclick="sFire()">FIRE! 💥 (${B.x}, ${B.y})</button></div></div>`)}
function sFire(){const s=B.sh.find(s=>!s.d&&s.x==B.x&&s.y==B.y);
if(s){s.d=1;beep(500,.15);setTimeout(()=>beep(800,.15),120);B.msg='Direct hit! Enemy ship sunk! 🎯';if(B.sh.every(s=>s.d))return gwin('ship',B.L,B.lives,'The enemy fleet is sunk!')}
else{beep(150,.3);B.lives--;B.m.push(B.x+','+B.y);B.msg='Wrong coordinates! The CPU fired back and sank one of your ships. Rethink and count again 🤔';if(B.lives<=0)return glose('ship',B.L,'The CPU sank your whole fleet. Count the squares carefully next time!')}
sScr()}

/* ===== ONLINE LOUNGE (shared chat + leaderboard) ===== */
let OL={st:'idle',tab:'chat',docs:{},uid:null,can:false,mod:false,db:null,note:''};
const QUICK=['GG! 🎉','Nice job!','I cleared a boss! ⭐','Good luck!','You can do it!','Count with me! 🔢'];
const NOGO=['stupid','idiot','dumb','hate','kill','shut up','fuck','shit','damn','sex','porn','bitch','bastard','crap','loser'];
const HX=/^#[0-9a-f]{3,8}$/i,esc2=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),own=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
function safeAv(a){a=a&&typeof a=='object'?a:{};const c=(v,d)=>typeof v=='string'&&HX.test(v)?v:d;return{skin:c(a.skin,'#e8b48a'),hair:c(a.hair,'#2a1d17'),hs:HSN.includes(a.hs)?a.hs:'short',face:FCN.includes(a.face)?a.face:'happy',outfit:(typeof a.outfit=='string'&&(HX.test(a.outfit)||PAT.includes(a.outfit)))?a.outfit:'#6b7a3a',hat:typeof a.hat=='string'&&own(HATS,a.hat)?a.hat:'none',badge:typeof a.badge=='string'&&own(BAD,a.badge)?a.badge:'★'}}
const myAv=()=>({skin:S.skin,hair:S.hair,hs:S.hs,face:S.face,outfit:S.outfit,hat:S.hat,badge:S.badge});
const myStars=()=>Object.values(S.pr).reduce((a,p)=>a+(Array.isArray(p)?p.reduce((x,y)=>x+(y||0),0):0),0);
function lclean(t){t=String(t||'').trim().slice(0,80);if(!t)return'';const l=t.toLowerCase();if(NOGO.some(w=>l.includes(w))||/\d[\d ]{5,}|@|https?:|www\.|\.com/i.test(t))return null;return t}
async function lounge(){if(OL.st==='none'||OL.st==='err')OL.st='idle';lscr();if(OL.st!=='idle')return;OL.st='load';
 try{const c=window.claude;if(!c||!c.use){OL.st='none';return lscr()}
  const[db,user]=await Promise.all([c.use('db'),c.use('user')]);if(!db||!user){OL.st='none';return lscr()}
  OL.db=db;OL.uid=await user.id();OL.can=!!OL.uid&&(await user.can('data.write'))!==false;OL.mod=!!(await user.canEdit());
  db.collection('chat').onSnapshot(snap=>{OL.docs={};snap.docs.forEach(d=>{if(d.exists)OL.docs[d.id]=d.data()});OL.st='on';lscr(1)},()=>{OL.st='err';lscr()});
  setTimeout(()=>{if(OL.st==='load'){OL.st='none';lscr()}},10000)}catch(e){OL.st='none';lscr()}}
function lmsgs(){const out=[];for(const[id,d]of Object.entries(OL.docs)){if(!d||!Array.isArray(d.msgs))continue;d.msgs.forEach(m=>{if(m&&typeof m.x=='string'&&typeof m.t=='number')out.push({id,hero:d.hero,av:d.av,t:m.t,x:m.x})})}return out.sort((a,b)=>a.t-b.t).slice(-40)}
function lbody(){const me=m=>m.id===OL.uid;
 if(OL.tab==='top'){const r=Object.entries(OL.docs).filter(([,d])=>d&&typeof d.stars=='number').sort((a,b)=>b[1].stars-a[1].stars).slice(0,10);
  return r.length?r.map(([id,d],i)=>`<div class="lm">${['🥇','🥈','🥉'][i]||'<b>'+(i+1)+'.</b>'}<span>${av(safeAv(d.av),38,1)}</span><b>${esc2(String(d.hero||'Hero').slice(0,12))}${id===OL.uid?' (you)':''}</b><span style="margin-left:auto">★ ${d.stars}</span></div>`).join(''):'<p class="sm">No scores yet. Send a message or press "Update my score" to join the board!</p>'}
 const l=lmsgs();return l.length?l.map(m=>`<div class="lm ${me(m)?'me':''}"><span>${av(safeAv(m.av),38,1)}</span><div class="lb"><small>${esc2(String(m.hero||'Hero').slice(0,12))}${me(m)?' (you)':''}</small><div>${esc2(m.x)}${OL.mod?` <button class="lx" onclick="ldel('${esc2(m.id)}',${m.t})" aria-label="Delete">✕</button>`:''}</div></div></div>`).join(''):'<p class="sm">No messages yet. Say hi! 👋</p>'}
function lscr(upd){const b=$('#lmsgs');if(upd&&b){b.innerHTML=lbody();b.scrollTop=b.scrollHeight;return}
 let h=`<div class="top">${back()}${coin()}</div><div><h1 class="big mid">Online Lounge</h1><p class="sm">Chat with friends on other devices. Be kind and never share your real name, school, phone or address.</p></div>`;
 if(OL.st==='none'||OL.st==='err')h+=`<div class="lbox"><p>The lounge could not connect. 😢 It works when the game is opened from claude.ai while signed in. Ask the game's owner to share it with you as a Contributor so you can chat.</p></div>`;
 else if(OL.st!=='on')h+=`<div class="lbox"><p>Connecting to the lounge… 🌐</p></div>`;
 else h+=`<div class="ltabs"><button class="btn" style="--c:${OL.tab=='chat'?'#c1392b':'#23395b'};padding:4px 14px" onclick="OL.tab='chat';lscr()">💬 Chat</button><button class="btn" style="--c:${OL.tab=='top'?'#c1392b':'#23395b'};padding:4px 14px" onclick="OL.tab='top';lscr()">🏆 Top heroes</button></div><div class="lbox" id="lmsgs">${lbody()}</div>${OL.tab=='top'?(OL.can?`<button class="btn" onclick="lscore()">Update my score ★ ${myStars()}</button>`:''):(OL.can?`<div class="lq">${QUICK.map((q,i)=>`<button class="btn" style="--c:#6b7a3a;padding:2px 10px;font-size:.9rem" onclick="lsend(QUICK[${i}])">${q}</button>`).join('')}</div><div class="lc"><input id="lin" maxlength="80" placeholder="Say something kind…" onkeydown="if(event.key=='Enter')lsend()"><button class="btn" onclick="lsend()">Send ▶</button></div>`:`<p class="sm">You can read the chat. To post, ask the owner to invite you as a Contributor.</p>`)}<p class="sm" id="lnote">${OL.note}</p>`;
 scr(h);const bb=$('#lmsgs');if(bb)bb.scrollTop=bb.scrollHeight}
const lnote=t=>{OL.note=t;const e=$('#lnote');if(e)e.textContent=t};
async function lwrite(text){const mine=OL.docs[OL.uid]||{},prev=Array.isArray(mine.msgs)?mine.msgs.filter(m=>m&&typeof m.x=='string'&&typeof m.t=='number'):[],msgs=text?[...prev,{t:Date.now(),x:text}].slice(-20):prev;
 await OL.db.doc('chat/'+OL.uid).set({hero:String(S.name||'Hero').slice(0,12),av:myAv(),stars:myStars(),msgs})}
async function lsend(t){if(!OL.can||!OL.db)return;const inp=$('#lin'),c=lclean(t!==undefined?t:inp&&inp.value);
 if(c===null)return lnote('Oops! Keep it kind and private: no bad words, links, emails or phone numbers.');if(!c)return;
 const mine=OL.docs[OL.uid],last=mine&&Array.isArray(mine.msgs)&&mine.msgs.length?mine.msgs[mine.msgs.length-1].t:0;if(Date.now()-last<2500)return lnote('Slow down a little! 🐢');
 try{await lwrite(c);if(inp)inp.value='';lnote('')}catch(e){lnote(e&&e.code==='invalid_argument'?'You can only read the chat. Ask the owner to make you a Contributor.':'Could not send. Try again in a moment.')}}
async function lscore(){try{await lwrite('');lnote('Score updated! ★')}catch(e){lnote('Could not update your score.')}}
async function ldel(id,t){if(!OL.mod)return;const d=OL.docs[id];if(!d||!Array.isArray(d.msgs))return;try{await OL.db.doc('chat/'+id).update({msgs:d.msgs.filter(m=>m.t!==t)})}catch(e){lnote('Could not delete that message.')}}

start();
</script></body></html>
